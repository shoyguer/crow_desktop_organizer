[package]
name = "crow"
version.workspace = true
edition = "2021"
description = "Crow DO, an ultra light desktop organizer for Windows"
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "crow"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "CrowDO"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[workspace]
members = ["shellext", "setup"]

# Shared by every crate. The version and the author show up in the app, the
# file properties and in the Windows list of installed apps. Change the
# version only here. Release tags use the same number, like v1.2.0.
[workspace.package]
version = "1.1.0"
authors = ["Lucas 'Shoyguer' Melo"]
repository = "https://github.com/shoyguer/crow_desktop_organizer"
license = "MIT"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false
overflow-checks = false
