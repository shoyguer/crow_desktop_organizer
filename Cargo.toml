[package]
name = "crow"
version = "1.0.0"
edition = "2021"
description = "Crow FO, an ultra light desktop folder organizer for Windows"
authors.workspace = true
repository.workspace = true

[lib]
name = "crow"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "CrowFO"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[workspace]
members = ["shellext", "setup"]

# Shared by every crate. The author shows up in the app, the file properties
# and in the Windows list of installed apps.
[workspace.package]
authors = ["Lucas Melo"]
repository = "https://github.com/shoyguer/crow_folder_organizer"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false
overflow-checks = false
