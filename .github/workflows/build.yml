name: Build

# Builds Crow and its installer on every push and pull request.
# Pushing a tag like v1.2.0 also publishes a GitHub release with the files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Build Crow
        run: cargo build --release -p crow

      - name: Build the installer
        run: cargo build --release -p crow-setup

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/CrowSetup.exe dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/crow.exe dist/crow-portable.exe
          Get-FileHash dist/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: crow-windows
          path: dist/

      # Free code signing for open source projects through the SignPath
      # Foundation (https://signpath.org). Once the project is accepted, add the
      # SIGNPATH_API_TOKEN secret and the IDs from the SignPath dashboard, then
      # remove the "if: false" line. The signed files replace the ones in dist.
      # Signed builds no longer trigger the SmartScreen warning, and they can
      # carry the Windows 11 context menu.
      - name: Sign with SignPath
        if: false
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: crow
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
